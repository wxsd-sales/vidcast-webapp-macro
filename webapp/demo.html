<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vidcast Web App Macro Demo</title>
    <style>
      :root {
        color-scheme: dark;
        --device-frame: #595959;
        --page-bg: #14161a;
        --header-bg: #20242a;
        --header-border: #333941;
        --control-bg: #2d333b;
        --control-border: #4a525d;
        --control-text: #f4f7fb;
        /* Fallback only: kept in sync with the header's real (possibly
           multi-line) rendered height by a ResizeObserver below. */
        --header-height: 64px;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        overflow: hidden;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: var(--page-bg);
        color: var(--control-text);
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .demo-header {
        min-height: 64px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 12px 20px;
        background: var(--header-bg);
        border-bottom: 1px solid var(--header-border);
      }

      .demo-header h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: 0;
      }

      .demo-controls {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .demo-control {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: rgba(244, 247, 251, 0.82);
      }

      .demo-control button,
      .demo-control select {
        min-height: 36px;
        border: 1px solid var(--control-border);
        border-radius: 6px;
        background: var(--control-bg);
        color: var(--control-text);
        font: inherit;
      }

      .demo-control button {
        min-width: 132px;
        padding: 0 14px;
        cursor: pointer;
      }

      .demo-control button[aria-pressed="true"] {
        border-color: #68d391;
        background: #244333;
      }

      .demo-control select {
        padding: 0 28px 0 10px;
      }

      .github-link {
        width: 38px;
        height: 36px;
        border: 1px solid var(--control-border);
        border-radius: 6px;
        background: var(--control-bg);
        color: var(--control-text);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        box-sizing: border-box;
        transition:
          background 0.15s,
          border-color 0.15s;
      }

      .github-link:hover,
      .github-link:focus-visible {
        border-color: #7b8794;
        background: #37404a;
      }

      .github-link:focus-visible {
        outline: 2px solid rgba(244, 247, 251, 0.86);
        outline-offset: 2px;
      }

      .github-link svg {
        width: 20px;
        height: 20px;
        display: block;
        fill: currentColor;
      }

      .surfaces {
        --demo-surface-height: calc(100vh - var(--header-height));
        --demo-frame-margin: 10px;
        --demo-frame-gutter: calc(var(--demo-frame-margin) * 2);
        /* Below this width a controller frame wraps onto its own row
           instead of continuing to shrink. */
        --controller-min-width: 240px;
        height: calc(100vh - var(--header-height));
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      #osd,
      #controller {
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #osd {
        flex: 1;
      }

      #controller {
        flex: 1;
        flex-wrap: wrap;
        align-content: center;
        overflow-y: auto;
      }

      #controller:empty {
        display: none;
      }

      .iframe-wrapper {
        /* The real webview's own layout resolution (CSS pixels, unitless
           here so it can be used in ratio math below). Defaults to the
           OSD's 1920x1080; .controller overrides both to 1280x800. Every
           other measurement on this frame - its own width/height, the
           iframe's zoom level, and its border thickness - is derived from
           these two numbers plus the frame's *actual* rendered size, so
           they all stay correctly proportioned at any demo window size. */
        --device-w: 1920;
        --device-h: 1080;
        /* The frame's own intended width, and (via its device aspect
           ratio) its own intended height. iframe zoom and border
           thickness below both read this back, instead of assuming a
           viewport-wide size that may not match how this particular frame
           actually laid out. */
        --frame-width: min(
          calc(((var(--demo-surface-height) / 2) - var(--demo-frame-gutter)) * var(--device-w) / var(--device-h)),
          calc(100vw - var(--demo-frame-gutter))
        );
        --frame-height: calc(var(--frame-width) * var(--device-h) / var(--device-w));
        flex: 0 1 var(--frame-width);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        box-sizing: border-box;
        margin: var(--demo-frame-margin);
        min-width: 0;
        width: var(--frame-width);
        aspect-ratio: var(--device-w) / var(--device-h);
        background-color: var(--device-frame);
      }

      .iframe-wrapper.controller {
        --device-w: 1280;
        --device-h: 800;
      }

      .surfaces[data-controller-count="0"] .iframe-wrapper.osd {
        --frame-width: min(
          calc((var(--demo-surface-height) - var(--demo-frame-gutter)) * var(--device-w) / var(--device-h)),
          calc(100vw - var(--demo-frame-gutter))
        );
      }

      #controller .iframe-wrapper {
        /* Ideal width if every current controller fit on one row; flex-wrap
           below takes over once --controller-min-width can no longer be
           honored at that count, wrapping extra frames onto new rows
           instead of shrinking them further. */
        --frame-width: min(
          calc(((var(--demo-surface-height) / 2) - var(--demo-frame-gutter)) * var(--device-w) / var(--device-h)),
          calc((100vw - (var(--demo-frame-gutter) * var(--controller-count))) / var(--controller-count))
        );
        min-width: var(--controller-min-width);
      }

      .iframe-wrapper iframe {
        display: block;
        height: 100%;
        width: 100%;
        zoom: calc(var(--frame-height) / (var(--device-h) * 1px));
        background-color: black;
        border: none;
      }

      .iframe-wrapper.osd {
        border-width: calc(20px * var(--frame-height) / (var(--device-h) * 1px));
        border-style: solid;
        border-color: var(--device-frame);
      }

      .iframe-wrapper.controller {
        display: flex;
        flex-direction: row;
        border-radius: calc(50px * var(--frame-height) / (var(--device-h) * 1px));
        border-width: calc(50px * var(--frame-height) / (var(--device-h) * 1px));
        border-style: solid;
        border-color: var(--device-frame);
      }

      .iframe-wrapper.controller iframe {
        border-radius: calc(50px * var(--frame-height) / (var(--device-h) * 1px));
      }

      @media (max-width: 900px) {
        .demo-header {
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
        }

        .demo-controls {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <header class="demo-header">
      <h1>Vidcast Web App Macro Demo</h1>
      <div class="demo-controls">
        <label class="demo-control">
          <span>OSD</span>
          <button id="osd-interactive" type="button" aria-pressed="false">
            Non Interactive
          </button>
        </label>
        <label class="demo-control">
          <span>Logo</span>
          <button id="osd-logo" type="button" aria-pressed="true">
            Visible
          </button>
        </label>
        <label class="demo-control">
          <span>Controllers</span>
          <select id="controller-count">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
          </select>
        </label>
        <a
          class="github-link"
          href="https://github.com/wxsd-sales/vidcast-webapp-macro"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open source repository on GitHub"
          title="GitHub repository"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.5c-2.22.48-2.69-.94-2.69-.94-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.22 1.88.87 2.34.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.22 2.2.82A7.6 7.6 0 0 1 8 3.86c.68 0 1.36.09 2 .27 1.52-1.04 2.19-.82 2.19-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0Z" />
          </svg>
        </a>
      </div>
    </header>
    <main class="surfaces">
      <div id="osd"></div>
      <div id="controller"></div>
    </main>

    <script>
      const PANEL_ID = "vidcast";
      const INDEX_URL = "index.html";

      const state = {
        osdInteractive: false,
        controllerCount: 2,
        showLogo: true,
      };

      function encodeLaunchHash(payload) {
        return "#" + btoa(JSON.stringify(payload));
      }

      function getOsdPayload() {
        return {
          mode: "player",
          demo: true,
          panelId: PANEL_ID,
          target: "OSD",
          interactive: state.osdInteractive,
          showLogo: state.showLogo,
        };
      }

      // Patches the given fields onto the OSD iframe's current hash so the
      // player view updates live without reloading the iframe.
      function patchOsdHash(patch) {
        const iframe = document.querySelector("#osd iframe");
        const win = iframe?.contentWindow;
        if (!win) return;

        let currentHash = {};
        try {
          const raw = win.location.hash.slice(1);
          if (raw) currentHash = JSON.parse(atob(raw));
        } catch (error) {
          currentHash = {};
        }

        win.location.hash = encodeLaunchHash({ ...currentHash, ...patch });
      }

      function getControllerPayload(index) {
        return {
          mode: "controls",
          demo: true,
          panelId: PANEL_ID,
          target: "Controller",
          peripheralId: `controller-${index + 1}`,
        };
      }

      function createFrame(surface, payload, title) {
        const frameWrapper = document.createElement("div");
        frameWrapper.classList.add("iframe-wrapper", surface);

        const iframe = document.createElement("iframe");
        iframe.title = title;
        iframe.src = INDEX_URL + encodeLaunchHash(payload);

        frameWrapper.appendChild(iframe);
        return frameWrapper;
      }

      // Only used at startup: later OSD state changes (interactive, logo)
      // are patched live onto this same iframe via patchOsdHash() instead
      // of reloading it, since it's the one surface actually being watched.
      function renderOsdFrame() {
        const osd = document.getElementById("osd");
        osd.replaceChildren(createFrame("osd", getOsdPayload(), "OSD"));
      }

      // Adds or removes only the controller iframes needed to match the
      // current controllerCount, leaving iframes that already match their
      // index untouched so changing the count doesn't reload every
      // controller (or the unrelated OSD iframe) each time.
      function syncControllerFrames() {
        const surfaces = document.querySelector(".surfaces");
        const controller = document.getElementById("controller");
        const wrappers = Array.from(controller.children);

        surfaces.dataset.controllerCount = String(state.controllerCount);
        controller.style.setProperty(
          "--controller-count",
          String(Math.max(state.controllerCount, 1)),
        );

        for (let i = wrappers.length - 1; i >= state.controllerCount; i -= 1) {
          wrappers[i].remove();
        }

        for (let i = wrappers.length; i < state.controllerCount; i += 1) {
          controller.appendChild(
            createFrame(
              "controller",
              getControllerPayload(i),
              `Controller ${i + 1}`,
            ),
          );
        }
      }

      function syncControls() {
        const osdToggle = document.getElementById("osd-interactive");
        osdToggle.textContent = state.osdInteractive
          ? "Interactive"
          : "Non Interactive";
        osdToggle.setAttribute("aria-pressed", String(state.osdInteractive));
        document.getElementById("controller-count").value = String(
          state.controllerCount,
        );

        const logoToggle = document.getElementById("osd-logo");
        logoToggle.textContent = state.showLogo ? "Visible" : "Hidden";
        logoToggle.setAttribute("aria-pressed", String(state.showLogo));
      }

      // Keeps --header-height in sync with the header's real rendered
      // height (it can wrap onto extra lines on narrow viewports), so the
      // surfaces area below is sized exactly right instead of guessing a
      // fixed pixel height per breakpoint.
      function watchHeaderHeight() {
        const header = document.querySelector(".demo-header");

        function syncHeaderHeight() {
          document.documentElement.style.setProperty(
            "--header-height",
            `${header.offsetHeight}px`,
          );
        }

        if (typeof ResizeObserver === "function") {
          new ResizeObserver(syncHeaderHeight).observe(header);
        } else {
          window.addEventListener("resize", syncHeaderHeight);
        }

        syncHeaderHeight();
      }

      function init() {
        const osdToggle = document.getElementById("osd-interactive");
        const controllerCount = document.getElementById("controller-count");
        const logoToggle = document.getElementById("osd-logo");

        watchHeaderHeight();

        osdToggle.addEventListener("click", () => {
          state.osdInteractive = !state.osdInteractive;
          syncControls();
          patchOsdHash({ interactive: state.osdInteractive });
        });

        controllerCount.addEventListener("change", (event) => {
          state.controllerCount = Number(event.target.value);
          syncControllerFrames();
        });

        logoToggle.addEventListener("click", () => {
          state.showLogo = !state.showLogo;
          syncControls();
          patchOsdHash({ showLogo: state.showLogo });
        });

        syncControls();
        renderOsdFrame();
        syncControllerFrames();
      }

      init();
    </script>
  </body>
</html>
